services:
  - type: web
    name: neurovision-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: APP_NAME
        value: NeuroVision AI
      - key: MODEL_PATH
        value: ./model/brain_tumor_model.pth
      - key: ALLOWED_ORIGINS
        value: "*"
